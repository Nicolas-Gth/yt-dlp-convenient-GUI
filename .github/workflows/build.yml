name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual run or branch push — use git describe
            VERSION=$(git describe --tags --match 'v*' 2>/dev/null | sed 's/^v//' || echo "dev")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > version_installer.txt
          echo "Building installer for version $VERSION"

      - name: Download Python installer
        shell: pwsh
        run: |
          $pythonVersion = '3.12.10'
          $url = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-amd64.exe"
          $out = "python-$pythonVersion-amd64.exe"
          Write-Host "Downloading Python $pythonVersion from $url"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Write-Host "Downloaded: $((Get-Item $out).Length) bytes"

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: |
          set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          "%ISCC%" /DMyAppVersion="${{ steps.version.outputs.VERSION }}" installer.iss

      - name: Verify output
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer\*.exe | Select-Object -First 1
          if ($installer) {
            Write-Host "Installer built: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
          } else {
            Write-Error "Installer not found in installer\ directory"
            exit 1
          }

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/yt-dlp-gui-setup-*.exe
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-setup-${{ steps.version.outputs.VERSION }}
          path: installer/yt-dlp-gui-setup-*.exe
